<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Alerta Universitaria</title>
    <!-- Bootstrap para que se vea profesional y bonito -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-header { background-color: #0d6efd; color: white; font-weight: bold; }
        #resultado-box { display: none; } /* Oculto hasta que haya predicción */
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row">
        <!-- FORMULARIO -->
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header">Evaluar Estudiante</div>
                <div class="card-body">
                    <form id="formulario-estudiante">
                        <div class="row g-3">
                            <h5 class="mt-3 border-bottom pb-2">Rendimiento Académico</h5>
                            <div class="col-md-3"><label>Aprobados S1</label><input type="number" id="aprobados_s1" class="form-control" value="2" required></div>
                            <div class="col-md-3"><label>Nota S1</label><input type="number" step="0.1" id="nota_s1" class="form-control" value="9.5" required></div>
                            <div class="col-md-3"><label>Aprobados S2</label><input type="number" id="aprobados_s2" class="form-control" value="1" required></div>
                            <div class="col-md-3"><label>Nota S2</label><input type="number" step="0.1" id="nota_s2" class="form-control" value="8.0" required></div>
                            <div class="col-md-6"><label>Cursos Inscritos S1</label><input type="number" id="cursos_s1" class="form-control" value="6" required></div>
                            <div class="col-md-6"><label>Cursos Inscritos S2</label><input type="number" id="cursos_s2" class="form-control" value="6" required></div>

                            <h5 class="mt-4 border-bottom pb-2">Perfil y Finanzas</h5>
                            <div class="col-md-2"><label>Edad</label><input type="number" id="edad" class="form-control" value="25" required></div>
                            <div class="col-md-3"><label>Género</label><select id="genero" class="form-select"><option value="0">Mujer</option><option value="1" selected>Hombre</option></select></div>
                            <div class="col-md-3"><label>Desplazado</label><select id="desplazado" class="form-select"><option value="0">No</option><option value="1" selected>Sí</option></select></div>
                            
                            <div class="col-md-4"><label>Pago al día</label><select id="pago_al_dia" class="form-select"><option value="0" selected>No</option><option value="1">Sí</option></select></div>
                            <div class="col-md-4"><label>Deudor</label><select id="deudor" class="form-select"><option value="0">No</option><option value="1" selected>Sí</option></select></div>
                            <div class="col-md-4"><label>Becado</label><select id="becado" class="form-select"><option value="0" selected>No</option><option value="1">Sí</option></select></div>

                            <h5 class="mt-4 border-bottom pb-2">Contexto Macroeconómico</h5>
                            <div class="col-md-4"><label>PBI</label><input type="number" step="0.1" id="pbi" class="form-control" value="1.5"></div>
                            <div class="col-md-4"><label>Desempleo (%)</label><input type="number" step="0.1" id="desempleo" class="form-control" value="10.8"></div>
                            <div class="col-md-4"><label>Inflación (%)</label><input type="number" step="0.1" id="inflacion" class="form-control" value="2.5"></div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mt-4 py-2">⚙️ Analizar Riesgo con IA</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- PANEL DE RESULTADOS -->
        <div class="col-md-4">
            <div class="card shadow" id="resultado-box">
                <div class="card-header bg-dark text-white">Resultado del Modelo</div>
                <div class="card-body text-center">
                    <h2 class="display-4 fw-bold" id="res-probabilidad">--%</h2>
                    <p class="text-muted">Probabilidad de Deserción</p>
                    <hr>
                    <h4 id="res-nivel" class="p-2 rounded">--</h4>
                    <p id="res-mensaje" class="mt-3"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 👇 REEMPLAZA ESTO CON TU URL DE RENDER (Asegúrate de mantener el /predecir_riesgo al final)
    const API_URL = "https://TU-URL-DE-RENDER.onrender.com/predecir_riesgo";

    document.getElementById("formulario-estudiante").addEventListener("submit", async function(event) {
        event.preventDefault(); // Evita que la página se recargue
        
        // 1. Recolectar datos del formulario
        const data = {
            aprobados_s1: parseFloat(document.getElementById("aprobados_s1").value),
            nota_s1: parseFloat(document.getElementById("nota_s1").value),
            aprobados_s2: parseFloat(document.getElementById("aprobados_s2").value),
            nota_s2: parseFloat(document.getElementById("nota_s2").value),
            cursos_s1: parseFloat(document.getElementById("cursos_s1").value),
            cursos_s2: parseFloat(document.getElementById("cursos_s2").value),
            edad: parseFloat(document.getElementById("edad").value),
            genero: parseInt(document.getElementById("genero").value),
            desplazado: parseInt(document.getElementById("desplazado").value),
            pago_al_dia: parseInt(document.getElementById("pago_al_dia").value),
            deudor: parseInt(document.getElementById("deudor").value),
            becado: parseInt(document.getElementById("becado").value),
            pbi: parseFloat(document.getElementById("pbi").value),
            desempleo: parseFloat(document.getElementById("desempleo").value),
            inflacion: parseFloat(document.getElementById("inflacion").value)
        };

        // 2. Mostrar "Cargando"
        const btn = document.querySelector("button");
        btn.innerText = "Analizando...";
        btn.disabled = true;

        try {
            // 3. Enviar datos a tu API en la nube
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (!response.ok) throw new Error("Error en el servidor");
            
            const resultado = await response.json();

            // 4. Mostrar el resultado en pantalla
            document.getElementById("resultado-box").style.display = "block";
            document.getElementById("res-probabilidad").innerText = resultado.probabilidad_desercion_pct + "%";
            
            const nivelElement = document.getElementById("res-nivel");
            nivelElement.innerText = "RIESGO " + resultado.nivel_riesgo;
            
            // Cambiar colores según el riesgo
            if(resultado.nivel_riesgo === "CRÍTICO") {
                nivelElement.className = "bg-danger text-white p-2 rounded";
                document.getElementById("res-mensaje").innerText = "⚠️ Alerta inmediata requerida por bienestar estudiantil.";
            } else if (resultado.nivel_riesgo === "MEDIO") {
                nivelElement.className = "bg-warning text-dark p-2 rounded";
                document.getElementById("res-mensaje").innerText = "👀 Monitoreo preventivo recomendado.";
            } else {
                nivelElement.className = "bg-success text-white p-2 rounded";
                document.getElementById("res-mensaje").innerText = "✅ Estudiante con buen pronóstico de continuidad.";
            }

        } catch (error) {
            alert("Error al conectar con la API: " + error.message);
        } finally {
            // Restaurar botón
            btn.innerText = "⚙️ Analizar Riesgo con IA";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
